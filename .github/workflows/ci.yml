name: Test and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Check NASA LOLA range access and GeoTIFF bundle (best effort)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npm run check:lola
      - name: Validate one real NASA LOLA 80m raster patch (best effort)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/validate-real-lola-patch'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock geotiff@2.1.3
          node scripts/validate-real-lola-patch.js
      - name: Produce genuine LOLA horizon cache for built-in sites (one-off)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/validate-real-lola-patch'
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/generate-lola-profiles.js
      - name: Live independent NASA/JPL Horizons audit (best effort)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npm run validate:jpl
