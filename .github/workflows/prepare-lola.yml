name: Prepare NASA LOLA site profiles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        site: [mons-mouton, malapert, shackleton, faustini, nobile]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Add standalone GeoTIFF parser
        run: npm install --no-save --no-package-lock geotiff@2.1.3
      - name: Extract real NASA local horizon
        run: node scripts/export-lola-site.js "${{ matrix.site }}"
